<style>
  /* La caja de documentos de entrega de una tarea de cruce. Se incluye una
     vez por pantalla, en cruces.html y en cruce_documentos.html. */
  .entrega{padding:12px 15px;border-top:1px solid var(--bdr);background:var(--bg-sutil)}
  .ent-hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .ent-hd h4{margin:0;font-size:11px;text-transform:uppercase;letter-spacing:.05em;
             color:var(--ink);font-weight:700}
  .ent-ayuda{font-size:11.5px}
  .ent-grupos{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
  .ent-grupo{border:1px solid var(--bdr);border-radius:10px;padding:9px 11px;background:var(--surface)}
  .ent-grupo.vacio{border-style:dashed}
  .ent-tit{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--soft);
           font-weight:600;margin-bottom:5px}
  .ent-arch{display:flex;justify-content:space-between;align-items:center;gap:6px;
            font-size:12px;padding:2px 0}
  .ent-arch label{display:flex;align-items:center;gap:6px;min-width:0;cursor:pointer}
  .ent-arch input[type=checkbox]{width:16px;height:16px;margin:0;flex:0 0 auto}
  .ent-arch a{font-family:'IBM Plex Mono',monospace;word-break:break-all;color:var(--accent-ink)}
  .ent-acc{display:flex;gap:4px;flex:0 0 auto}
  .ent-acc .btn{padding:2px 7px}
  .entrega .nada{font-size:12px;color:var(--soft);font-style:italic}
  .ent-subir{margin-top:7px}
  .ent-botones{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  @media (max-width:700px){
    .ent-grupos{grid-template-columns:1fr}
    .ent-botones .btn{flex:1 1 100%;text-align:center}
  }
</style>
