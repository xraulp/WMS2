{% load static %}{% comment %}
Lo que hace al WMS instalable en la pantalla de inicio del telefono. En iPhone
es obligatorio para los avisos push: Safari solo deja recibirlos a lo que se
agrego a la pantalla de inicio y se abre desde ese icono.
{% endcomment %}
<link rel="manifest" href="{% url 'push_manifest' %}">
<link rel="apple-touch-icon" href="{% static 'warehouse/push/icono-180.png' %}">
<link rel="icon" type="image/png" sizes="192x192" href="{% static 'warehouse/push/icono-192.png' %}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WMS">
<meta name="theme-color" content="#0f172a">
