{% load i18n %}<div class="status-msg status-success">
  ✓ {% blocktrans with id=operation.custom_id %}Operation <strong>{{ id }}</strong> saved successfully.{% endblocktrans %}
  <a href="#" @click.prevent="$dispatch('switch-tab', 'database')" style="margin-left:8px; color:var(--ok-ink); font-weight:600; text-decoration:underline;" x-data>{% trans "View in Operations" %} →</a>
</div>
<script>
  // Reset form after success
  document.getElementById('operation-form').reset();
  // Set today's date again
  const dateField = document.querySelector('input[type=date]');
  if (dateField) dateField.value = new Date().toISOString().split('T')[0];
</script>
